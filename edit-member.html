<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit member</title>
    <link rel="stylesheet" href="css/add-member.css">
</head>
<body>
    <div class="container">
        <aside class="sidebar">
            <h2>GYM</h2>
            <ul>
                 <li><a href="dashboard.html">Dashboard</a></li>

                <li><a href="add-member.html">Add Member</a></li>

                <li><a href="members.html" class="active">Members</a></li>

                <li><a href="attendance.html">Attendance</a></li>

                <li><a href="attendance-history.html">Attendance-History</a></li>

                <li><a href="payments.html">Payments</a></li>

                <li><a href="reports.html">Reports</a></li>

                <li><a href="index.html">Logout</a></li>
            </ul>
        </aside>
        <main class="main-content">
            <div class="header">
                <h1>Edit Member</h1>
                <p>Update member details.</p>
            </div>
            <div class="form-container">
                <form id="editForm">
                     <div class="input-group">
                        <label>Full Name</label>
                        <input type="text" id="name" required>
                    </div>

                    <div class="input-group">
                        <label>Age</label>
                        <input type="number" id="age" required>
                    </div>

                    <div class="input-group">
                        <label>Gender</label>

                        <select id="gender" required>
                            <option>Male</option>
                            <option>Female</option>
                            <option>Other</option>
                             </select>
                    </div>

                    <div class="input-group">
                        <label>Phone</label>
                        <input type="text" id="phone" required>
                    </div>

                    <div class="input-group">
                        <label>Email</label>
                        <input type="email" id="email" required>
                    </div>

                    <div class="input-group">
                        <label>Membership</label>

                        <select id="membership" required>
                            <option>1 Month</option>
                            <option>3 Months</option>
                            <option>6 Months</option>
                            <option>12 Months</option>
                        </select>
                          </div>

                    <div class="input-group">
                        <label>Joining Date</label>
                        <input type="date" id="joinDate" required>
                    </div>

                    <div class="input-group">
                        <label>Status</label>

                        <select id="status">
                            <option>Active</option>
                            <option>Inactive</option>
                        </select>
                    </div>

                    <div class="buttons">

                        <button type="submit" class="save-btn">
                            Update Member
                        </button>
                        </div>
                </form>
            </div>
        </main>
    </div>
    <script src="js/edit-member.js"></script>
</body>
</html>
