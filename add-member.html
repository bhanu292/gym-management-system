<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Member</title>
    <link rel="stylesheet" href="css/add-member.css">
</head>
<body>
    <div class="container">
        <aside class="sidebar">
            <h2>GYM</h2>
            <ul>
                <li><a href=dashboard.html>Dashboard</a></li>
                  <li><a href="add-member.html" class="active">Add Member</a></li>
                <li><a href="members.html">Members</a></li>
                <li><a href="attendance.html">Attendance</a></li>
                <li><a href="attendance-history.html">Attendance-History</a></li>
                <li><a href="payments.html">Payments</a></li>
                <li><a href="reports.html">Reports</a></li>
                <li><a href="index.html">Logout</a></li>
            </ul>
        </aside>
        <main class="main-content">
            <div class="header">
                <h1>Add New Member</h1>
                <p>Fill in the details below.</p>
            </div>
            <div class="form-container">
                <form id="memberForm">
                    <div class="input-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" required>
                    </div>
                    <div class="input-group">
                        <label for="age">Age</label>
                        <input type="number" id="age" required>
                    </div>
                    <div class="input-group">
                        <label for="gender">Gender</label>
                        <select id="gender" required>
                            <option value="">Select Gender</option>
                            <option>Male</option>
                            <option>Female</option>
                            <option>Other</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label for="phone">Phone Number</label>
                        <input type="tel" id="phone" required>
                    </div>
                    <div class="input-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" required>
                    </div>
                    <div class="input-group">
                        <label for="membership">Membership Plan</label>
                        <select id="membership" required>
                            <option value="">Select Plan</option>
                            <option>1 Month</option>
                            <option>3 Month</option>
                            <option>6 Month</option>
                            <option>12 Month</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label for="joinDate">Joining Date</label>
                        <input type="date" id="joinDate" required>
                    </div>
                    <div class="input-group">
                        <label for="status">Status</label>
                        <select id="status">
                            <option>Active</option>
                            <option>Inactive</option>
                        </select>
                    </div>
                    <div class="buttons">
                        <button type="submit" class="save-btn">Save Member</button>
                        <button type="reset" class="reset-btn">Reset</button>
                    </div>
                </form>
            </div>
        </main>
    </div>
    <script src="js/add-member.js"></script>
</body>
</html>
